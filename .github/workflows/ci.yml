name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "File tidak terformat:"; gofmt -l .
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -race -count=1
      - name: build
        run: go build ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build semua target
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            echo "== $goos/$goarch =="
            GOOS=$goos GOARCH=$goarch go build ./...
          done
